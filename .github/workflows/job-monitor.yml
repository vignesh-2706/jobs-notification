name: Job Monitor

on:
  schedule:
    # Runs every 12 hours
   - cron: ""
  workflow_dispatch:
    inputs:
      person:
        description: "Run for one person only (filename without .json), or leave as 'all'"
        required: false
        default: "all"
        type: string

permissions:
  contents: write # needed so the workflow can commit updated history files

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ensures full git history for commit and push operations

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job monitor
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          PERSON_FILTER: ${{ github.event.inputs.person || 'all' }}
        run: |
          set -e
          if [ "$PERSON_FILTER" != "all" ]; then
            TARGETS="configs/${PERSON_FILTER}.json"
            if [ ! -f "$TARGETS" ]; then
              echo "No such config: $TARGETS"
              exit 1
            fi
          else
            TARGETS="configs/*.json"
          fi

          for f in $TARGETS; do
            base=$(basename "$f")
            if [[ "$base" == _* ]]; then
              echo "Skipping template/hidden file: $f"
              continue
            fi
            echo "=============================================="
            echo "Running job monitor for: $f"
            echo "=============================================="
            python job_monitor.py "$f" || echo "!! $f failed, continuing with the rest !!"
          done

      - name: Save updated history files back to the repo
        run: |
          git config user.name "job-monitor-bot"
          git config user.email "job-monitor-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update job history [automated]"
          git pull --rebase origin main
          git push origin main
